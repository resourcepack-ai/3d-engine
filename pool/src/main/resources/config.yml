# 3D Pool
#
# Tables are placed with /pool create and kept in tables.yml.

# Draw the aiming guide (the line to the ghost ball, and where the object ball
# goes). Off by default, as in Shooterspool; F toggles it at the table.
aim-guide: false

# The stroke: hold S to draw the cue back and let go to hit, harder the further
# back it is. How long S takes to draw it all the way back, and a multiplier on
# how fast the cue ball leaves the tip.
stroke:
  draw-seconds: 1.5
  power: 1.0
