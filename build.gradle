subprojects {
    apply plugin: 'java'

    group = 'ai.resourcepack'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xmaxerrs', '1000']
        options.compilerArgs += ['-Xmaxerrs', '1000']
    }

    repositories {
        mavenCentral()
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }

    dependencies {
        compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
        compileOnly 'org.jetbrains:annotations:24.1.0'
        testImplementation 'com.google.code.gson:gson:2.10.1'
        testImplementation 'org.yaml:snakeyaml:2.2'
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    }

    test {
        useJUnitPlatform()
        maxHeapSize = '2g'
        systemProperty 'slim', System.getProperty('slim', 'false')
        systemProperty 'sample', System.getProperty('sample', '')
        systemProperty 'slimTriangles', System.getProperty('slimTriangles', '9000')
        systemProperty 'slimTexture', System.getProperty('slimTexture', '512')
        systemProperty 'labradorTriangles', System.getProperty('labradorTriangles', '0')
        systemProperty 'labradorTexture', System.getProperty('labradorTexture', '0')
        testLogging { showStandardStreams = true }
    }

    processResources {
        inputs.property('version', project.version)
        filesMatching('plugin.yml') {
            expand(version: project.version)
        }
    }
}
