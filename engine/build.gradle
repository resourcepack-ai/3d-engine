plugins {
    id 'com.gradleup.shadow' version '8.3.5'
}

version = '0.1.1'
base { archivesName = '3DEngine' }

repositories {
    // ai.resourcepack:common, our own shared plugin library. Exclusive: the
    // ai.resourcepack group is looked for here and nowhere else, so a
    // look-alike published to Central or any repository above cannot stand in
    // for it. (A checkout with ../plugin-common builds it from source instead;
    // see settings.gradle.)
    exclusiveContent {
        forRepository {
            maven { url = 'https://repo.resourcepack.ai' }
        }
        filter {
            includeGroup 'ai.resourcepack'
        }
    }
}

// Paper's half of the Platform layer, compiled against Paper's API and loaded
// only on a Paper server; everything else compiles against Spigot's.
sourceSets {
    paper {
        java { srcDir 'src/paper/java' }
        compileClasspath += sourceSets.main.output
    }
}

dependencies {
    paperCompileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    // The small library our plugins shade in (the usage heartbeat), relocated
    // below so it never meets another plugin's copy.
    implementation 'ai.resourcepack:common:0.2.1'
}

// The shaded jar is the plugin. The plain one keeps a classifier so the two
// never share a name, and is what the addons compile against.
shadowJar {
    archiveClassifier.set('')
    from sourceSets.paper.output
    relocate 'ai.resourcepack.common', 'ai.resourcepack.engine3d.libs.common'
}

jar {
    archiveClassifier.set('plain')
}

build {
    dependsOn shadowJar
}
