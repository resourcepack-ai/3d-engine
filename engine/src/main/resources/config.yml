# 3D Engine
#
# Put .glb, .gltf or .obj files in plugins/3DEngine/models/ and run /3d reload.
# Each file can have a .yml of the same name beside it (scale, animations,
# transitions, attachment points); see the README.
#
# After editing this file, run /3d reload: everything here takes effect then,
# except pack.host, pack.port and pack.bind, which need a server restart.

pack:
  # Serve the resource pack from this server over HTTP.
  host: true
  port: 8163
  # The address to listen on; empty = all.
  bind: ""
  # The address players download the pack from, e.g. http://play.example.com:8163
  # Empty = this server's IP and the port above.
  url: ""
  # Send the pack to players as they join (turn off if another plugin merges
  # plugins/3DEngine/pack.zip into its own pack).
  send: true
  required: false
  prompt: ""
  # The pack format: [major, minor]. The shaders target Minecraft 26.3.
  format: [97, 1]
  description: "3D Engine models"

quality:
  # How many triangles a model is cut to, and how wide its texture is, when its
  # .yml doesn't say. More is sharper, and makes the pack bigger and the game
  # heavier for players: an animated model stores its whole mesh once per frame.
  triangles: 20000
  texture-width: 512
  # The most any model may keep, whatever its .yml or /3d quality says.
  max-triangles: 200000
  max-texture-width: 2048
  # Per model, set in game with /3d quality <model> <triangles> [texture width].
  # These win over the model's own .yml. /3d quality reads this file before it
  # saves, so edits you have made here by hand are kept.
  models: {}

seats:
  # Raise (or, negative, lower) everyone sitting in a model's seats by this many
  # blocks, if riders sit a little high or low on your server.
  height-offset: 0.0

# Anonymous usage count, and the only telemetry 3D Engine has: every 30
# seconds it sends a random id, how many players are online and the names of
# plugins that depend on it. Nothing else.
telemetry: true

# Tells you in the console, and anybody with 3dengine.update (ops) in chat,
# when a newer 3D Engine is on SpigotMC.
update-check: true
